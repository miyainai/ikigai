name: Locus availability
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check landing page and app route
        shell: bash
        run: |
          set -euo pipefail
          for path in / /ikigai-alpha; do
            curl --fail --silent --show-error --retry 2 --max-time 20 "https://find-your-locus.vercel.app$path" -o /tmp/page.html
            grep -qi '<title>Locus</title>' /tmp/page.html
          done
      - name: Check activity endpoint without recording an event
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --retry 2 --max-time 20 \
            -H 'Origin: https://find-your-locus.vercel.app' \
            -H 'Content-Type: application/json' --data '{}' \
            https://psaddlwwgwqpeuyyqzjt.supabase.co/functions/v1/activity-event \
            -o /tmp/activity-response -w '%{http_code}')
          test "$status" = 400
